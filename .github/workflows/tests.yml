# Steps come from the shared reusable workflows in fairyofdata/Concordia (docs/DECISIONS.md D1).
name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  pytest:
    uses: fairyofdata/Concordia/.github/workflows/python-tests.yml@v1
    with:
      python-versions: '["3.11", "3.12"]'
      install: pip install pandas numpy scipy scikit-learn pytest
      test: pytest -v

  hygiene:
    uses: fairyofdata/Concordia/.github/workflows/hygiene.yml@v1
